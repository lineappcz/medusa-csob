name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        medusa: [2.19.0, 2.20.1]
    services:
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: matrix.medusa != '2.19.0'
        run: pnpm add -D @medusajs/framework@${{ matrix.medusa }}
      - run: pnpm check
      - run: pnpm format:check
      - run: node scripts/pack-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-node-${{ matrix.node }}-medusa-${{ matrix.medusa }}
          path: |
            coverage/
          retention-days: 14
  verify:
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
